[project]
name = "ml-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.142.1",
    "numpy>=2.5.4",
    "pymysql[rsa]>=1.2.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
eda = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "pandas>=3.1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Đo độ phủ test mỗi lần chạy pytest: in bảng ra terminal, ghi coverage.xml cho SonarQube.
addopts = "--cov --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
# Đo cả ml-service/ (app/, scripts/) như 1 thư mục nguồn, để coverage.xml ghi đường dẫn đầy đủ
# (app/main.py). Khai riêng app và scripts thì file chỉ còn tên (__init__.py), SonarQube không
# phân biệt được file nào và bỏ cả báo cáo.
source = ["."]
omit = ["tests/*"]
