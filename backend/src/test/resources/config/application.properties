# Cau hinh rieng cho test. Spring Boot doc ca classpath:/application.properties (cua code chinh)
# lan classpath:/config/application.properties (file nay), gia tri o day ghi de.

# Test dung CSDL rieng fashionshop_test (tu tao neu chua co), khong dung vao du lieu cua may dev:
# vd sau khi nap danh muc mau Tiki, test tao danh muc "Giay nam" se bao trung ten.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/fashionshop_test?createDatabaseIfNotExist=true

# Khong nap danh muc mau luc khoi dong; CatalogSeedServiceTest goi thang service.
app.catalog-seed.enabled=false

# Phien ket noi cua test dung mui gio khac UTC (+07:00): khi do NOW() va UTC_TIMESTAMP() tra ve
# gia tri khac nhau, nen test cua recompute_request (chi dung gio UTC) moi bat duoc loi neu code
# quay lai dung NOW(). Cot DATETIME ghi tu LocalDateTime cua JVM khong bi anh huong.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'

# Test tự gọi các việc định kỳ (hủy đơn quá hạn, hoàn tiền) khi cần; khóa VNPay giả chỉ dùng trong test.
app.scheduling.enabled=false
app.vnpay.tmn-code=TESTCODE
app.vnpay.hash-secret=khoa-gia-chi-dung-trong-test

# Test khong goi ml-service (du ml-service dang chay tren may voi CSDL fashionshop): goi y theo quy
# tac; test rieng cua goi y hoc may dung MlServiceClient gia.
app.ml-service.enabled=false
