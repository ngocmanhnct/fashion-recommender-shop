spring.application.name=fashionshop
# --- Database (MySQL qua Docker Compose) ---
# DB_HOST: chay tren may = localhost (mac dinh); trong Docker Compose = mysql (ten service)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/fashionshop
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:changeme_local_dev}

# Flyway quan ly schema -> Hibernate CHI kiem tra khop, khong tu tao/sua
spring.jpa.hibernate.ddl-auto=validate
# Nap danh sach lien ket (bien the, anh, danh muc) theo lo 50 thay vi tung dong, tranh N+1 query
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Bat chi tiet health-check (db, disk...) o local dev de tu kiem tra
management.endpoint.health.show-details=always
# CORS cho Actuator khai rieng (WebConfig.java khong ap dung cho /actuator/*), nhung dung chung danh sach origin
management.endpoints.web.cors.allowed-origins=${app.cors.allowed-origins}
management.endpoints.web.cors.allowed-methods=GET

# --- Cau hinh rieng cua ung dung ---
# Origin duoc phep goi API, cach nhau dau phay. Dung chung cho WebConfig.java va Actuator.
# Docker Compose truyen them http://localhost:3000 (frontend chay bang Nginx).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Dia chi ml-service cho MlServiceClient (Tuan 8+). Trong Docker Compose = http://ml-service:8000
app.ml-service.base-url=${ML_SERVICE_URL:http://localhost:8000}
# Cho toi da 500ms moi lan goi (san pham lien quan, goi y theo khao sat); qua han hay ml-service tat
# thi dung goi y theo quy tac. Dat ML_SERVICE_ENABLED=false de khong goi ml-service.
app.ml-service.timeout=500ms
app.ml-service.enabled=${ML_SERVICE_ENABLED:true}

# --- Xac thuc (Buoc 2 Tuan 5) ---
# Khoa ky JWT (HS256, toi thieu 32 ky tu), chi dat qua bien moi truong JWT_SECRET, khong ghi vao file.
# De trong (may dev, CI): backend tu sinh khoa ngau nhien moi lan khoi dong, token cu mat hieu luc.
app.jwt.secret=${JWT_SECRET:}
# Thoi han token: 24 gio (Bang 2.8 muc 2)
app.jwt.expiration=24h
# Tai khoan Quan tri vien dau tien, tao luc khoi dong neu email chua co tai khoan. De trong = bo qua.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- Danh muc san pham mau tu du lieu Tiki (Tuan 6) ---
# Luc khoi dong, neu bang product chua co dong nao (ke ca san pham da xoa mem) thi nap danh muc
# mau tu file JSON. Dat CATALOG_SEED_ENABLED=false de tat. Test tat san (src/test/resources/config).
app.catalog-seed.enabled=${CATALOG_SEED_ENABLED:true}
app.catalog-seed.location=classpath:seed/tiki-catalog.json

# Thanh toán VNPay (US-10, BR-28, BR-34). Mã website và khóa bí mật chỉ đặt ở .env, để trống thì
# chỉ có COD. returnUrl là trang của frontend (npm run dev: 5173; Docker: 3000).
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}

# Email đặt lại mật khẩu (chức năng 21) qua SMTP, vd Gmail: MAIL_HOST=smtp.gmail.com,
# MAIL_USERNAME = địa chỉ Gmail, MAIL_PASSWORD = mật khẩu ứng dụng 16 ký tự (không phải mật khẩu
# Gmail). Để trống MAIL_HOST thì không gửi email; MAIL_LOG_LINKS=true (chỉ trên máy dev) ghi nội dung
# email, kể cả liên kết, vào log. Liên kết trỏ về FRONTEND_URL (npm run dev: 5173; Docker: 3000).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Không để /actuator/health kiểm tra máy chủ email: Gmail chậm hay sai mật khẩu không được làm
# backend bị coi là hỏng (Docker healthcheck, UptimeRobot).
management.health.mail.enabled=false
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.log-links=${MAIL_LOG_LINKS:false}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
