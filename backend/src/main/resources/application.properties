spring.application.name=fashionshop
# --- Database (MySQL qua Docker Compose) ---
# DB_HOST: chay tren may = localhost (mac dinh); trong Docker Compose = mysql (ten service)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/fashionshop
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:changeme_local_dev}

# Flyway quan ly schema -> Hibernate CHI kiem tra khop, khong tu tao/sua
spring.jpa.hibernate.ddl-auto=validate

# Bat chi tiet health-check (db, disk...) o local dev de tu kiem tra
management.endpoint.health.show-details=always
# CORS cho Actuator khai rieng (WebConfig.java khong ap dung cho /actuator/*), nhung dung chung danh sach origin
management.endpoints.web.cors.allowed-origins=${app.cors.allowed-origins}
management.endpoints.web.cors.allowed-methods=GET

# --- Cau hinh rieng cua ung dung ---
# Origin duoc phep goi API, cach nhau dau phay. Dung chung cho WebConfig.java va Actuator.
# Docker Compose truyen them http://localhost:3000 (frontend chay bang Nginx).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Dia chi ml-service cho MLServiceClient (Tuan 8+). Trong Docker Compose = http://ml-service:8000
app.ml-service.base-url=${ML_SERVICE_URL:http://localhost:8000}
