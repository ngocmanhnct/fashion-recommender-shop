spring.application.name=fashionshop
# --- Database (MySQL qua Docker Compose) ---
spring.datasource.url=jdbc:mysql://localhost:3306/fashionshop
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:changeme_local_dev}

# Flyway quan ly schema -> Hibernate CHI kiem tra khop, khong tu tao/sua
spring.jpa.hibernate.ddl-auto=validate

# Bat chi tiet health-check (db, disk...) o local dev de tu kiem tra
management.endpoint.health.show-details=always
# CORS rieng cho Actuator - khong dung chung cau hinh voi WebConfig.java
management.endpoints.web.cors.allowed-origins=http://localhost:5173
management.endpoints.web.cors.allowed-methods=GET