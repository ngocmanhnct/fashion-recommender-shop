# Nginx chỉ phục vụ file tĩnh của React (không làm reverse proxy cho API — trình duyệt gọi
# thẳng backend, xem dac-ta-yeu-cau.md Mục 11).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Đường dẫn không khớp file thật nào thì trả index.html, để React Router (Tuần 5-6)
    # xử lý được khi người dùng tải lại trang ở một route như /products/12.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html luôn hỏi lại máy chủ, để sau mỗi lần deploy trình duyệt lấy đúng tên file JS/CSS
    # mới (file cũ đã bị xóa khỏi image).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # File do Vite build có mã băm trong tên: nội dung không bao giờ đổi, cache lâu được.
    # Thiếu file thì trả 404, không trả index.html (trình duyệt sẽ báo lỗi MIME khó hiểu).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
