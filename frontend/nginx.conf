# Nginx chỉ phục vụ file tĩnh của React (không làm reverse proxy cho API — trình duyệt gọi
# thẳng backend, xem dac-ta-yeu-cau.md Mục 11).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Đường dẫn không khớp file thật nào thì trả index.html, để React Router (Tuần 5-6)
    # xử lý được khi người dùng tải lại trang ở một route như /products/12.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
