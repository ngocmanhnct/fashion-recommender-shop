# Cấu hình phân tích SonarQube Cloud (trước gọi là SonarCloud): 1 project cho cả monorepo.
# Job "SonarQube Cloud" trong .github/workflows/ci.yml đọc file này.
# Trong file .properties, dấu # chỉ là chú thích khi đứng đầu dòng: đừng viết chú thích
# sau giá trị trên cùng 1 dòng.

# 2 khóa này phải khớp đúng project trên SonarQube Cloud (trang Information của project).
sonar.organization=ngocmanhnct
sonar.projectKey=ngocmanhnct_fashion-recommender-shop
sonar.projectName=fashion-recommender-shop

# Mã nguồn và test của 3 service. Chỉ ghi thư mục đã có: thư mục không tồn tại làm lần quét
# bị lỗi. Test frontend nằm ở thư mục riêng frontend/tests (không đặt cạnh code trong
# frontend/src: file sẽ thuộc cả sources lẫn tests, lần quét lỗi "can't be indexed twice").
# Thêm thư mục test mới (vd frontend/e2e cho Playwright) thì thêm vào sonar.tests.
sonar.sources=backend/src/main/java,frontend/src,ml-service/app,ml-service/scripts
sonar.tests=backend/src/test/java,ml-service/tests,frontend/tests
sonar.sourceEncoding=UTF-8

# Java: Sonar phân tích trên file .class kèm thư viện .jar. Job CI tạo các thư mục này
# (mvnw test-compile + dependency:copy-dependencies) ngay trước khi quét. Test cần thấy cả
# lớp của code chính nên sonar.java.test.libraries có thêm backend/target/classes.
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/sonar-libs/main/*.jar
sonar.java.test.libraries=backend/target/classes,backend/target/sonar-libs/test/*.jar

# Python: khớp ml-service/.python-version.
sonar.python.version=3.13

# Độ phủ test: job Backend, ML service (Tuần 7) và Frontend (Tuần 9) tạo 3 file này, job
# SonarQube Cloud tải về trước khi quét. lcov.info ghi đường dẫn tính từ gốc repo
# (frontend/src/...), cấu hình ở frontend/vite.config.js.
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.python.coverage.reportPaths=ml-service/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
